apiVersion: batch/v1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: astranull-notification-retry-scheduler
  labels:
    app.kubernetes.io/name: astranull
    app.kubernetes.io/component: notification-retry-scheduler
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 180
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: astranull
            app.kubernetes.io/component: notification-retry-scheduler
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          serviceAccountName: astranull-worker
          containers:
            - name: runner
              # Render out-of-tree with scripts/render-kubernetes-worker-manifests.mjs.
              image: ghcr.io/astranull/astranull-worker@__ASTRANULL_WORKER_IMAGE_DIGEST__
              imagePullPolicy: IfNotPresent
              command: ["node", "scripts/notification-retry-scheduler.mjs"]
              args:
                - "--tenant-ids-file"
                - "/config/tenant-ids.json"
                - "--once"
                - "--out"
                - "/tmp/notification-retry-summary.json"
              env:
                - name: NODE_ENV
                  value: "production"
                - name: ASTRANULL_PERSISTENCE_MODE
                  value: "postgres"
                - name: ASTRANULL_ENFORCE_DATABASE_ROLE
                  value: "1"
                - name: ASTRANULL_NOTIFICATION_DELIVERY_MODE
                  value: metadata_only
                - name: ASTRANULL_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: astranull-worker-env
                      key: ASTRANULL_DATABASE_URL
                - name: ASTRANULL_PG_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: astranull-worker-env
                      key: ASTRANULL_PG_SSL_CA
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 384Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: tenant-scope
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: tenant-scope
              configMap:
                name: astranull-worker-tenant-ids
                items:
                  - key: tenant-ids.json
                    path: tenant-ids.json