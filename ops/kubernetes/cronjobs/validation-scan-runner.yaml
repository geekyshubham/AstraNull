apiVersion: batch/v1
kind: CronJob
metadata:
  name: astranull-validation-scan-runner
  labels:
    app.kubernetes.io/name: astranull
    app.kubernetes.io/component: validation-scan-runner
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: astranull
            app.kubernetes.io/component: validation-scan-runner
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          serviceAccountName: astranull-worker
          containers:
            - name: runner
              # Render out-of-tree with scripts/render-kubernetes-worker-manifests.mjs.
              image: __ASTRANULL_WORKER_IMAGE_REPOSITORY__@__ASTRANULL_WORKER_IMAGE_DIGEST__
              imagePullPolicy: IfNotPresent
              command: ["node", "scripts/validation-scan-runner.mjs"]
              args:
                - "--tenant-ids-file"
                - "/config/tenant-ids.json"
                - "--limit"
                - "25"
                - "--out"
                - "/tmp/validation-scan-summary.json"
              env:
                - name: NODE_ENV
                  value: "production"
                - name: ASTRANULL_PERSISTENCE_MODE
                  value: "postgres"
                - name: ASTRANULL_ENFORCE_DATABASE_ROLE
                  value: "1"
                - name: ASTRANULL_PROBE_MODE
                  value: "signed-worker"
                - name: ASTRANULL_VALIDATION_SCAN_RUNNER_ID
                  value: "validation-scan-runner-k8s"
                - name: ASTRANULL_PROBE_WORKER_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: astranull-worker-env
                      key: ASTRANULL_PROBE_WORKER_SECRET
                - name: ASTRANULL_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: astranull-worker-env
                      key: ASTRANULL_DATABASE_URL
                - name: ASTRANULL_PG_SSL_CA
                  valueFrom:
                    secretKeyRef:
                      name: astranull-worker-env
                      key: ASTRANULL_PG_SSL_CA
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: tenant-scope
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: tenant-scope
              configMap:
                name: astranull-worker-tenant-ids
                items:
                  - key: tenant-ids.json
                    path: tenant-ids.json
