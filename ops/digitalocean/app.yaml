# DigitalOcean App Platform spec — astranull.site
# Create once: doctl apps create --spec ops/digitalocean/app.yaml
# Update:      doctl apps update <APP_ID> --spec ops/digitalocean/app.yaml
name: astranull
region: nyc

domains:
  - domain: astranull.site
    type: PRIMARY
  - domain: www.astranull.site
    type: ALIAS

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

databases:
  - name: astranull-db
    engine: PG
    version: "16"
    size: db-s-dev
    num_nodes: 1

services:
  - name: web
    dockerfile_path: ops/digitalocean/Dockerfile
    source_dir: /
    github:
      repo: geekyshubham/astranull
      branch: main
      deploy_on_push: false
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 90
      period_seconds: 15
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 5
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: ASTRANULL_PUBLIC_BASE_URL
        scope: RUN_TIME
        value: https://astranull.site
      - key: ASTRANULL_PERSISTENCE_MODE
        scope: RUN_TIME
        value: postgres
      - key: ASTRANULL_DEPLOYMENT_PROFILE
        scope: RUN_TIME
        value: hosted-staging
      - key: ASTRANULL_BUNDLED_STAGING_OIDC
        scope: RUN_TIME
        value: "1"
      - key: ASTRANULL_AUTH_MODE
        scope: RUN_TIME
        value: oidc-jwt
      # OIDC identity is PINNED to the currently LIVE host
      # (astranull-qteog.ondigitalocean.app), NOT to ASTRANULL_PUBLIC_BASE_URL.
      # Rationale: bundledStagingOidc derives issuer/JWKS from the public base URL
      # when these are unset. This spec keeps the astranull.site custom domain as
      # the public base URL, but existing tokens were minted with the
      # ondigitalocean issuer. Pinning here keeps both DO specs consistent on
      # OIDC identity and prevents a `doctl apps update` from silently flipping
      # the issuer and invalidating all live tokens. The app serves
      # /.well-known/jwks.json on every hostname it answers, so the pinned JWKS
      # URL resolves regardless of the public base URL.
      - key: ASTRANULL_OIDC_ISSUER
        scope: RUN_TIME
        value: https://astranull-qteog.ondigitalocean.app/staging-oidc
      - key: ASTRANULL_OIDC_JWKS_URL
        scope: RUN_TIME
        value: https://astranull-qteog.ondigitalocean.app/.well-known/jwks.json
      # Pinned so startup does not read the fixture just to learn the audience.
      - key: ASTRANULL_OIDC_AUDIENCE
        scope: RUN_TIME
        value: astranull-hosted-staging
      # OPERATOR ACTION REQUIRED — the token-signing keypair. Keep in sync with .do/app.yaml.
      #
      # This was a git-committed file (ops/staging/bundled-oidc-fixture.json) in a PUBLIC
      # repo until 2026-08-01, making the auth trust root world-readable: anyone could mint a
      # valid admin token. It is now gitignored and excluded from the image, and the published
      # key is refused at startup by fingerprint — untracking cannot help, because public git
      # history keeps it recoverable forever.
      #
      # Startup FAILS CLOSED without this secret rather than booting and 500-ing every login.
      #   1. npm run oidc:fixture:generate -- --force
      #   2. Paste ops/staging/bundled-oidc-fixture.json contents as this secret.
      - key: ASTRANULL_BUNDLED_STAGING_OIDC_FIXTURE_JSON
        scope: RUN_TIME
        type: SECRET
        # Single quotes are REQUIRED — see the matching note in .do/app.yaml. Substitution
        # is textual, so unquoted YAML parses the fixture's leading `{` as a flow mapping
        # and App Platform rejects the spec (envs.value must be a string).
        value: '${ASTRANULL_BUNDLED_STAGING_OIDC_FIXTURE_JSON}'
      - key: ASTRANULL_PUBLIC_LOGIN_URL
        scope: RUN_TIME
        value: /login
      - key: ASTRANULL_PROBE_MODE
        scope: RUN_TIME
        value: signed-worker
      - key: ASTRANULL_HIGH_SCALE_ADAPTER_MODE
        scope: RUN_TIME
        value: disabled
      - key: ASTRANULL_AGENT_IDENTITY_MODE
        scope: RUN_TIME
        value: bearer
      - key: ASTRANULL_WAF_POSTURE_ENABLED
        scope: RUN_TIME
        value: "1"
      - key: ASTRANULL_CONNECTORS_ENABLED
        scope: RUN_TIME
        value: "0"
      - key: ASTRANULL_DATABASE_URL
        scope: RUN_TIME
        value: ${astranull-db.DATABASE_URL}
      # OPERATOR ACTION REQUIRED — this disables PostgreSQL TLS certificate
      # verification (MITM exposure on the DB connection). Left in place only
      # because removing it before a CA is configured would drop the live
      # database connection. To close it out:
      #   1. Download the DigitalOcean managed-Postgres CA certificate.
      #   2. Set ASTRANULL_PG_SSL_CA (PEM contents) or ASTRANULL_PG_SSL_CA_FILE
      #      (mounted path) on this service.
      #   3. Confirm startup logs no longer warn about relaxed TLS, then delete
      #      this variable.
      # With a CA configured the app keeps verification ON and ignores this flag.
      - key: ASTRANULL_PG_SSL_REJECT_UNAUTHORIZED
        scope: RUN_TIME
        value: "0"
      # Set these in the DO dashboard (or as encrypted app envs) before first deploy:
      # - ASTRANULL_SECRET_ENCRYPTION_KEY  (64 hex chars)
      # - ASTRANULL_PROBE_WORKER_SECRET    (32+ chars)