name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned, not `@v4`: a major tag is a mutable pointer the action owner can
      # retarget (see tj-actions/changed-files, March 2025). The trailing comment is the
      # version at that SHA and is what dependabot rewrites. The deploy workflow explains
      # the full reasoning; CI runs on every push and PR, so it is the widest trigger
      # surface in the repo even though it holds no deploy credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # node-version here is a runtime guard, not a preference: tests/unit/runtime-version-pin.test.mjs
      # fails if this drifts off the allowed majors, so CI cannot silently start testing a
      # different (or end-of-life) line than the Dockerfiles build on.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # `npm ci` installs exactly the locked versions and fails if package.json
      # and package-lock.json have drifted. `cache: npm` above also depends on
      # the lockfile being present.
      - name: Install dependencies
        run: npm ci

      # Failing gate. Audits the FULL tree, not just runtime deps: the known
      # postcss path-traversal advisory reaches us transitively through vite, so
      # `--omit=dev` would report "0 vulnerabilities" and make this gate a no-op.
      # Build-time dependencies execute in CI and in image builds, so they are
      # in scope for the supply-chain claim.
      - name: Dependency audit (high or above fails)
        run: npm audit --audit-level=high

      # Runtime-only view, reported separately so a shipped-dependency finding is
      # never lost in build-time noise.
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: node scripts/lint.mjs

      - name: Portal lint
        run: npm run lint:portal

      - name: Deployment artifacts
        run: |
          ruby -e "require 'yaml'; YAML.parse_file('.github/workflows/deploy-aws.yml'); YAML.parse_file('.github/workflows/publish-kubernetes-worker.yml'); YAML.parse_file('.github/workflows/reset-accessibility-password.yml')"
          bash -n ops/aws/deploy.sh
          bash -n ops/aws/restore.sh
          bash -n ops/aws/reset-accessibility-runner-password.sh
          node --check scripts/validate-aws-compose-secrets.mjs
          node --check scripts/worker-heartbeat-health.mjs
          node --check scripts/reset-accessibility-runner-password.mjs
          docker compose -f ops/aws/docker-compose.yml --env-file ops/aws/env.example --profile ops config --no-interpolate --no-path-resolution >/dev/null
          docker build -f ops/aws/Dockerfile -t astranull-ci-check:${GITHUB_SHA:-local} .
          docker build -f ops/kubernetes/Dockerfile.worker -t astranull-worker-ci-check:${GITHUB_SHA:-local} .
          worker_digest="$(docker image inspect --format '{{.Id}}' astranull-worker-ci-check:${GITHUB_SHA:-local})"
          rendered_dir="$(mktemp -d)"
          trap 'rm -rf "$rendered_dir"' EXIT
          node scripts/render-kubernetes-worker-manifests.mjs --check-source
          node scripts/render-kubernetes-worker-manifests.mjs --digest "$worker_digest" --out-dir "$rendered_dir"
          node scripts/render-kubernetes-worker-manifests.mjs --validate-dir "$rendered_dir"

      - name: Web typecheck
        run: npm run web:typecheck

      # The token-signing fixture is gitignored (it was a committed private key in a public
      # repo), so a fresh checkout does not have one and any test that reads it fails.
      # package.json declares this via `pretest:unit`, but the steps below invoke
      # `node --test` directly and so never run npm's pretest hook. Generating it here keeps
      # the local and CI story identical instead of relying on a leftover file.
      - name: Generate local OIDC signing fixture
        run: npm run oidc:fixture:ensure

      - name: Unit tests
        run: node --test tests/unit/*.test.mjs

      - name: Integration tests
        run: node --test tests/integration/*.test.mjs

      - name: E2E tests
        run: node --test tests/e2e/*.test.mjs

      - name: Safety check
        run: node scripts/safety-check.mjs

      - name: DB schema contract
        run: node scripts/validate-db-schema.mjs

      - name: Postgres tenant query audit
        run: node scripts/postgres-tenant-query-audit.mjs

      - name: Resource-exhaustion taxonomy validation (DET-025)
        run: node scripts/validate-resource-exhaustion-taxonomy.mjs

      - name: Generated check library is in sync
        run: node scripts/generate-check-library-html.mjs --check

      - name: Edge signature corpus provenance and hash parity
        run: node --test tests/unit/edge-signature-corpus.test.mjs

      # apps/web/react-app.{js,css} is a hand-committed bundle that is deployed
      # as-is. Nothing else rebuilds it, so portal source and the shipped bundle
      # can silently diverge. Rebuild from source and fail if the result differs
      # from what is committed.
      - name: Portal bundle is in sync with source
        run: |
          npm run web:build
          if ! git diff --exit-code -- apps/web/react-app.js apps/web/react-app.css; then
            echo "::error::Committed portal bundle does not match a fresh build of apps/web/react. Run 'npm run web:build' and commit the regenerated apps/web/react-app.js and apps/web/react-app.css."
            exit 1
          fi
