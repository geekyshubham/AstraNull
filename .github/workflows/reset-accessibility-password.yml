name: Reset accessibility runner password
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character release SHA that is deployed on astranull.site
        required: true
        type: string
# Shared with the deploy workflow so a reset cannot overlap a deployment; the run also
# pins itself to the exact deployed SHA, so a stale trigger fails closed.
concurrency:
  group: deploy-aws
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  reset:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact requested release revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      # The password exists only as a step env value. It is never interpolated into the
      # run script, never an argv element, never written to a file or the workflow output,
      # and is piped exactly once, framed, through ssh stdin into the container operator.
      - name: Reset accessibility runner password and verify live login
        env:
          SSH_KEY: ${{ secrets.ASTRANULL_AWS_SSH_KEY }}
          HOST: ${{ secrets.ASTRANULL_AWS_HOST }}
          SSH_USER: ${{ secrets.ASTRANULL_AWS_USER }}
          KNOWN_HOSTS: ${{ secrets.ASTRANULL_AWS_KNOWN_HOSTS }}
          ASTRANULL_ACCESSIBILITY_RUNNER_PASSWORD: ${{ secrets.ASTRANULL_ACCESSIBILITY_RUNNER_PASSWORD }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?missing SSH key}"; : "${HOST:?missing host}"; : "${KNOWN_HOSTS:?missing pinned host key}"
          : "${ASTRANULL_ACCESSIBILITY_RUNNER_PASSWORD:?missing accessibility runner password}"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          remote_main=$(git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')
          [[ "$remote_main" == "$RELEASE_SHA" ]]

          transferred_files=(
            ops/aws/reset-accessibility-runner-password.sh
            ops/aws/deploy.sh
            ops/aws/release-state.sh
          )
          checked_files=("${transferred_files[@]}" scripts/reset-accessibility-runner-password.mjs)
          for transferred_file in "${transferred_files[@]}"; do
            [[ -f "$transferred_file" && ! -L "$transferred_file" ]]
            git ls-files --error-unmatch -- "$transferred_file" >/dev/null
          done
          [[ -x ops/aws/reset-accessibility-runner-password.sh ]]
          [[ -f scripts/reset-accessibility-runner-password.mjs && ! -L scripts/reset-accessibility-runner-password.mjs ]]
          git ls-files --error-unmatch -- scripts/reset-accessibility-runner-password.mjs >/dev/null
          git diff --exit-code HEAD -- "${checked_files[@]}"
          wrapper_sha256=$(sha256sum ops/aws/reset-accessibility-runner-password.sh | awk '{print $1}')
          deploy_sha256=$(sha256sum ops/aws/deploy.sh | awk '{print $1}')
          state_lib_sha256=$(sha256sum ops/aws/release-state.sh | awk '{print $1}')
          operator_sha256=$(sha256sum scripts/reset-accessibility-runner-password.mjs | awk '{print $1}')
          [[ "$wrapper_sha256" =~ ^[0-9a-f]{64}$ && "$deploy_sha256" =~ ^[0-9a-f]{64}$ \
            && "$state_lib_sha256" =~ ^[0-9a-f]{64}$ && "$operator_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]

          user="${SSH_USER:-ubuntu}"
          remote_wrapper="/tmp/astranull-reset-accessibility-${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          remote_deploy="/tmp/astranull-deploy-${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          remote_state="/tmp/astranull-release-state-${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/astranull-reset"; chmod 600 "$HOME/.ssh/astranull-reset"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh_base=(-i "$HOME/.ssh/astranull-reset" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          uploaded=0
          cleanup() {
            if ((uploaded)); then
              timeout -k 5 30 ssh "${ssh_base[@]}" "${user}@${HOST}" \
                "rm -f -- '$remote_wrapper' '$remote_deploy' '$remote_state'" >/dev/null 2>&1 || true
            fi
            rm -f "$HOME/.ssh/astranull-reset"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          uploaded=1
          timeout -k 5 60 scp "${ssh_base[@]}" ops/aws/reset-accessibility-runner-password.sh "${user}@${HOST}:${remote_wrapper}"
          timeout -k 5 60 scp "${ssh_base[@]}" ops/aws/deploy.sh "${user}@${HOST}:${remote_deploy}"
          timeout -k 5 60 scp "${ssh_base[@]}" ops/aws/release-state.sh "${user}@${HOST}:${remote_state}"

          # Only the wrapper, deploy.sh, and release-state.sh are transferred; the operator
          # already runs from the deployed release image. The framed password enters the
          # pipeline solely through stdin and the remote side forwards it untouched.
          # The kill-after bound guarantees a wedged ssh cannot outlive the timeout.
          reset_metadata=$(printf '%s\nastranull-accessibility-password-reset-v1\n' "$ASTRANULL_ACCESSIBILITY_RUNNER_PASSWORD" | \
            timeout -k 10 1800 ssh "${ssh_base[@]}" -o ServerAliveInterval=30 -o ServerAliveCountMax=3 "${user}@${HOST}" \
            "set -euo pipefail; cleanup() { rm -f -- '$remote_wrapper' '$remote_deploy' '$remote_state'; }; trap cleanup EXIT; trap 'exit 129' HUP; trap 'exit 130' INT; trap 'exit 143' TERM; chmod 700 '$remote_wrapper'; chmod 600 '$remote_deploy' '$remote_state'; printf '%s  %s\n' '$wrapper_sha256' '$remote_wrapper' | sha256sum -c - >/dev/null; printf '%s  %s\n' '$deploy_sha256' '$remote_deploy' | sha256sum -c - >/dev/null; printf '%s  %s\n' '$state_lib_sha256' '$remote_state' | sha256sum -c - >/dev/null; bash '$remote_wrapper' '$RELEASE_SHA' '$operator_sha256' '$remote_deploy' '$remote_state'")

          RESET_METADATA="$reset_metadata" node --input-type=module -e '
            try {
              // The password exists only as this short-lived local string: it is deleted
              // from process.env immediately and nulled as soon as it has been delivered.
              let password = process.env.ASTRANULL_ACCESSIBILITY_RUNNER_PASSWORD ?? "";
              delete process.env.ASTRANULL_ACCESSIBILITY_RUNNER_PASSWORD;
              const metadata = JSON.parse(process.env.RESET_METADATA ?? "");
              if (
                metadata?.status !== "password_reset"
                || metadata?.tenant_id !== "ten_demo"
                || typeof metadata?.user_id !== "string" || metadata.user_id.length === 0
                || metadata?.email !== "accessibility-runner@astranull.invalid"
                || metadata?.session_generation_rotated !== true
                || metadata?.password_sessions_invalidated !== true
                || metadata?.lockout_cleared !== true
              ) process.exit(1);
              let body = null;
              const response = await fetch("https://astranull.site/v1/auth/login", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ email: metadata.email, password }),
                redirect: "manual",
                signal: AbortSignal.timeout(15000),
              });
              // The password has been delivered; drop the last local reference.
              password = null;
              if (response.status !== 200) process.exit(1);
              body = await response.json();
              let token = typeof body?.access_token === "string" && body.access_token.length > 0
                ? body.access_token
                : null;
              const verified = {
                tenant_id: typeof body?.tenant_id === "string" ? body.tenant_id : null,
                user_id: typeof body?.user_id === "string" ? body.user_id : null,
                principal: typeof body?.principal === "string" ? body.principal : null,
                role_nonempty: typeof body?.role === "string" && body.role.length > 0,
                bearer: token !== null && body?.token_type === "Bearer",
              };
              // Immediately drop the token and every local reference to it and to the
              // raw response body.
              token = null;
              body.access_token = null;
              body = null;
              if (
                verified.tenant_id !== metadata.tenant_id
                || verified.user_id !== metadata.user_id
                || verified.principal !== "customer"
                || !verified.role_nonempty
                || !verified.bearer
              ) process.exit(1);
              // The single combined metadata-only verification line: reset flags plus
              // login facts. It never contains the password, the invite token, the
              // bearer token, or any response body content.
              const combined = {
                status: "password_reset_verified",
                reset_status: metadata.status,
                tenant_id: verified.tenant_id,
                user_id: verified.user_id,
                email: metadata.email,
                session_generation_rotated: metadata.session_generation_rotated,
                password_sessions_invalidated: metadata.password_sessions_invalidated,
                lockout_cleared: metadata.lockout_cleared,
                login_verified: true,
                principal: verified.principal,
                role_nonempty: verified.role_nonempty,
                bearer: verified.bearer,
              };
              process.stdout.write(`${JSON.stringify(combined)}\n`);
            } catch {
              // Never emit raw body, token, password, or error text.
              process.exit(1);
            }
          '

          unset SSH_KEY ASTRANULL_ACCESSIBILITY_RUNNER_PASSWORD
