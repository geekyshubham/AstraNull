# Generated by guardianctl. Scanner logic remains in Geekyshubham/guardianbot.
name: GuardianBot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
  schedule:
    - cron: "23 2 * * *"
    - cron: "*/15 * * * *"
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardianbot-security-gate:
    name: guardianbot/security-gate
    if: github.event_name != 'schedule' || github.event.schedule == '23 2 * * *'
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
    uses: Geekyshubham/guardianbot/.github/workflows/reusable-security.yml@70df177cd0cbdadf97f819bcdfc13a1e16216ce5
    with:
      config-path: .guardianbot/config.yml

  guardianbot-image:
    name: guardianbot/image-security
    if: github.event_name != 'schedule' || github.event.schedule == '23 2 * * *'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: Geekyshubham/guardianbot/.github/workflows/reusable-image.yml@70df177cd0cbdadf97f819bcdfc13a1e16216ce5
    with:
      dockerfile: "ops/digitalocean/Dockerfile"
      context: "."
      image-name: "ghcr.io/geekyshubham/astranull"
      health-path: "/health"
      readiness-path: "/ready"
      container-port: 8080
      dependent-services: "postgres,redis"
      ephemeral-env-keys: ""
      runtime-env: |
          # No runtime environment values configured.
      migration-command: "node scripts/migrate-postgres.mjs"
      smoke-command: "node --check src/index.mjs && node --check scripts/railway-staging-start.mjs"
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}


  guardianbot-dast-smoke:
    name: guardianbot/dast-smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *')
    permissions:
      contents: read
      id-token: write
    uses: Geekyshubham/guardianbot/.github/workflows/reusable-dast.yml@70df177cd0cbdadf97f819bcdfc13a1e16216ce5
    with:
      target-origin: "https://guardianbot-astranull-stage-sisf9.ondigitalocean.app"
      openapi: "docs/api/guardianbot-dast-openapi.json"
      openapi-source: "repository-file"
      authentication-profile: "control-plane://profiles/astranull-staging"
      session-assertion-path: "/v1/checks"
      excluded-routes: "[]"
      scan-profile: "authenticated-baseline"
      minutes: 15

  guardianbot-dast-nightly:
    name: guardianbot/dast-nightly
    if: github.event_name == 'schedule' && github.event.schedule == '47 2 * * *'
    permissions:
      contents: read
      id-token: write
    uses: Geekyshubham/guardianbot/.github/workflows/reusable-dast.yml@70df177cd0cbdadf97f819bcdfc13a1e16216ce5
    with:
      target-origin: "https://guardianbot-astranull-stage-sisf9.ondigitalocean.app"
      openapi: "docs/api/guardianbot-dast-openapi.json"
      openapi-source: "repository-file"
      authentication-profile: "control-plane://profiles/astranull-staging"
      session-assertion-path: "/v1/checks"
      excluded-routes: "[]"
      scan-profile: "authenticated-full"
      minutes: 45
