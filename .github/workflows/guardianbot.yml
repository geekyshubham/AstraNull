# Generated by guardianctl. Scanner logic remains in Geekyshubham/guardianbot.
name: GuardianBot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
  schedule:
    - cron: "23 2 * * *"
    - cron: "*/15 * * * *"
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardianbot-security-gate:
    name: guardianbot/security-gate
    if: github.event_name != 'schedule' || github.event.schedule == '23 2 * * *'
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
    uses: Geekyshubham/guardianbot/.github/workflows/reusable-security.yml@7524547700e4c3994353f5c61d1625b2bd5e5428
    with:
      config-path: .guardianbot/config.yml

  guardianbot-image:
    name: guardianbot/image-security
    if: github.event_name != 'schedule' || github.event.schedule == '23 2 * * *'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: Geekyshubham/guardianbot/.github/workflows/reusable-image.yml@7524547700e4c3994353f5c61d1625b2bd5e5428
    with:
      dockerfile: "ops/aws/Dockerfile"
      context: "."
      image-name: "ghcr.io/geekyshubham/astranull"
      health-path: "/health"
      readiness-path: "/ready"
      container-port: 8080
      dependent-services: "postgres,redis"
      ephemeral-env-keys: "ASTRANULL_SECRET_ENCRYPTION_KEY,ASTRANULL_PROBE_WORKER_SECRET"
      policy-mode: "report-only"
      promotion-mode: "verified-default-branch"
      runtime-env: |
          ASTRANULL_DATABASE_URL=postgresql://guardianbot:guardianbot@guardianbot-postgres:5432/guardianbot?sslmode=disable
          ASTRANULL_PUBLIC_BASE_URL=https://guardianbot.invalid
          ASTRANULL_PERSISTENCE_MODE=postgres
          ASTRANULL_DEPLOYMENT_PROFILE=hosted-staging
          ASTRANULL_BUNDLED_STAGING_OIDC=0
          ASTRANULL_OIDC_ISSUER=https://guardianbot.invalid/staging-oidc
          ASTRANULL_OIDC_AUDIENCE=astranull-hosted-staging
          ASTRANULL_OIDC_JWKS_URL=https://guardianbot.invalid/.well-known/jwks.json
          ASTRANULL_AUTH_MODE=oidc-jwt
          ASTRANULL_PROBE_MODE=signed-worker
          ASTRANULL_HIGH_SCALE_ADAPTER_MODE=disabled
          ASTRANULL_AGENT_IDENTITY_MODE=bearer
      migration-command: "node scripts/migrate-postgres.mjs"
      smoke-command: "node --check src/index.mjs && node --check scripts/railway-staging-start.mjs"
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}


  guardianbot-dast-smoke:
    name: guardianbot/dast-smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *')
    permissions:
      contents: read
      id-token: write
    uses: Geekyshubham/guardianbot/.github/workflows/reusable-dast.yml@7524547700e4c3994353f5c61d1625b2bd5e5428
    with:
      target-origin: "https://guardianbot-astranull-stage-sisf9.ondigitalocean.app"
      openapi: "docs/api/guardianbot-dast-openapi.json"
      openapi-source: "repository-file"
      authentication-profile: "control-plane://profiles/astranull-staging"
      session-assertion-path: "/v1/checks"
      excluded-routes: "[]"
      scan-profile: "authenticated-baseline"
      minutes: 15

  guardianbot-dast-nightly:
    name: guardianbot/dast-nightly
    if: github.event_name == 'schedule' && github.event.schedule == '47 2 * * *'
    permissions:
      contents: read
      id-token: write
    uses: Geekyshubham/guardianbot/.github/workflows/reusable-dast.yml@7524547700e4c3994353f5c61d1625b2bd5e5428
    with:
      target-origin: "https://guardianbot-astranull-stage-sisf9.ondigitalocean.app"
      openapi: "docs/api/guardianbot-dast-openapi.json"
      openapi-source: "repository-file"
      authentication-profile: "control-plane://profiles/astranull-staging"
      session-assertion-path: "/v1/checks"
      excluded-routes: "[]"
      scan-profile: "authenticated-full"
      minutes: 45

