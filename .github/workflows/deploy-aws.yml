name: Deploy AWS
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
concurrency:
  group: deploy-aws
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact CI-tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Deploy exact verified revision to EC2
        env:
          SSH_KEY: ${{ secrets.ASTRANULL_AWS_SSH_KEY }}
          HOST: ${{ secrets.ASTRANULL_AWS_HOST }}
          SSH_USER: ${{ secrets.ASTRANULL_AWS_USER }}
          KNOWN_HOSTS: ${{ secrets.ASTRANULL_AWS_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?missing SSH key}"; : "${HOST:?missing host}"; : "${KNOWN_HOSTS:?missing pinned host key}"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_SHA" ]]
          transferred_files=(
            ops/aws/deploy.sh
            ops/aws/release-state.sh
            scripts/postgres-retention-helper.py
          )
          for transferred_file in "${transferred_files[@]}"; do
            [[ -f "$transferred_file" && ! -L "$transferred_file" ]]
            git ls-files --error-unmatch -- "$transferred_file" >/dev/null
          done
          [[ -x ops/aws/deploy.sh ]]
          git diff --exit-code HEAD -- "${transferred_files[@]}"
          script_sha256=$(sha256sum ops/aws/deploy.sh | awk '{print $1}')
          state_lib_sha256=$(sha256sum ops/aws/release-state.sh | awk '{print $1}')
          retention_helper_sha256=$(sha256sum scripts/postgres-retention-helper.py | awk '{print $1}')
          [[ "$script_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$state_lib_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$retention_helper_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]

          user="${SSH_USER:-ubuntu}"
          remote_script="/tmp/astranull-deploy-${DEPLOY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          remote_state_lib="/tmp/astranull-release-state-${DEPLOY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          remote_retention_helper="/tmp/astranull-postgres-retention-helper-${DEPLOY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/astranull-deploy"; chmod 600 "$HOME/.ssh/astranull-deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          uploaded=0
          cleanup() {
            if ((uploaded)); then
              timeout -k 5 30 ssh -i "$HOME/.ssh/astranull-deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "${user}@${HOST}" "rm -f -- '$remote_script' '$remote_state_lib' '$remote_retention_helper'" >/dev/null 2>&1 || true
            fi
            rm -f "$HOME/.ssh/astranull-deploy"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          uploaded=1
          timeout -k 5 60 scp -i "$HOME/.ssh/astranull-deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 ops/aws/deploy.sh "${user}@${HOST}:${remote_script}"
          timeout -k 5 60 scp -i "$HOME/.ssh/astranull-deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 ops/aws/release-state.sh "${user}@${HOST}:${remote_state_lib}"
          timeout -k 5 60 scp -i "$HOME/.ssh/astranull-deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 scripts/postgres-retention-helper.py "${user}@${HOST}:${remote_retention_helper}"
          timeout 1800 ssh -i "$HOME/.ssh/astranull-deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 "${user}@${HOST}" \
            "set -euo pipefail; cleanup() { rm -f -- '$remote_script' '$remote_state_lib' '$remote_retention_helper'; }; trap cleanup EXIT; trap 'exit 129' HUP; trap 'exit 130' INT; trap 'exit 143' TERM; chmod 700 '$remote_script'; chmod 600 '$remote_state_lib' '$remote_retention_helper'; printf '%s  %s\n' '$script_sha256' '$remote_script' | sha256sum -c -; printf '%s  %s\n' '$state_lib_sha256' '$remote_state_lib' | sha256sum -c -; printf '%s  %s\n' '$retention_helper_sha256' '$remote_retention_helper' | sha256sum -c -; ASTRANULL_RELEASE_STATE_LIB='$remote_state_lib' ASTRANULL_DEPLOY_POSTGRES_RETENTION_HELPER='$remote_retention_helper' bash '$remote_script' '$DEPLOY_SHA'"
