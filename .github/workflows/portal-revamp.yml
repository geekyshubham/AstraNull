name: Portal revamp

on:
  pull_request:
    paths:
      - 'apps/web/react/**'
      - 'src/services/**'
      - 'src/persistence/**'
      - 'db/migrations/**'
      - 'tests/**'
      - 'scripts/lint-portal-no-hardcoded.mjs'
      - 'scripts/assert-portal-matrix.mjs'
      - '.github/workflows/portal-revamp.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/react/**'
      - 'src/services/**'
      - 'src/persistence/**'
      - 'db/migrations/**'
      - 'tests/**'
      - 'scripts/lint-portal-no-hardcoded.mjs'
      - 'scripts/assert-portal-matrix.mjs'

jobs:
  portal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, contract, integration, e2e, portal-scale, lint, a11y, db-migrate]
    steps:
      # SHA-pinned rather than `@v4` for the same reason as the other two workflows: a
      # major tag can be retargeted by its owner, and this job runs on pull_request, so
      # it executes code from branches that have not been reviewed yet.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # `npm ci` respects the lockfile; `cache: npm` above also requires it.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: matrix.suite == 'e2e' || matrix.suite == 'a11y'
        run: npx playwright install --with-deps chromium

      - name: Run portal suite (${{ matrix.suite }})
        env:
          ASTRANULL_PORTAL_SCALE: ${{ matrix.suite == 'portal-scale' && '1' || '' }}
          ASTRANULL_PORTAL_PERF_ITERATIONS: ${{ matrix.suite == 'portal-scale' && '12' || '' }}
          ASTRANULL_PORTAL_SCALE_FAST: ''
        run: |
          npm run db:migrate:test
          npm run test:${{ matrix.suite }}
