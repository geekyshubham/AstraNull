# DigitalOcean App Platform spec — deployed by GitHub Actions (digitalocean/app_action/deploy@v2).
# Image is built in CI and pushed to GHCR; no DigitalOcean↔GitHub OAuth link required.
name: astranull
region: nyc

domains:
  - domain: astranull.site
    type: PRIMARY
  - domain: www.astranull.site
    type: ALIAS

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

databases:
  - name: astranull-db
    engine: PG
    version: "16"
    size: db-s-dev
    num_nodes: 1

services:
  - name: web
    image:
      registry_type: GHCR
      registry: geekyshubham
      repository: astranull
      registry_credentials: ${GHCR_CREDENTIALS}
      digest: ${IMAGE_DIGEST}
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 90
      period_seconds: 15
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 5
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: ASTRANULL_PUBLIC_BASE_URL
        scope: RUN_TIME
        value: https://astranull-qteog.ondigitalocean.app
      - key: ASTRANULL_PERSISTENCE_MODE
        scope: RUN_TIME
        value: postgres
      - key: ASTRANULL_DEPLOYMENT_PROFILE
        scope: RUN_TIME
        value: hosted-staging
      - key: ASTRANULL_BUNDLED_STAGING_OIDC
        scope: RUN_TIME
        value: "1"
      - key: ASTRANULL_AUTH_MODE
        scope: RUN_TIME
        value: oidc-jwt
      # OIDC identity is PINNED to the live host so tokens stay valid.
      # bundledStagingOidc derives issuer/JWKS from ASTRANULL_PUBLIC_BASE_URL
      # when these are unset; pinning them here prevents a silent issuer flip
      # (and mass token invalidation) if the base URL ever changes.
      - key: ASTRANULL_OIDC_ISSUER
        scope: RUN_TIME
        value: https://astranull-qteog.ondigitalocean.app/staging-oidc
      - key: ASTRANULL_OIDC_JWKS_URL
        scope: RUN_TIME
        value: https://astranull-qteog.ondigitalocean.app/.well-known/jwks.json
      # Pinned so startup does not have to read the fixture just to learn the audience.
      - key: ASTRANULL_OIDC_AUDIENCE
        scope: RUN_TIME
        value: astranull-hosted-staging
      # REQUIRED, and coupled to config.mjs `requireExplicitRoleMap`.
      #
      # Production resolves roles ONLY through this map. Without it every token is rejected
      # (pickRole skips unmapped candidates → invalid_role) and all login breaks on the next
      # deploy. So this entry and that flag have to ship together.
      #
      # The map is identity because the bundled fixture emits platform role names directly.
      # Verified against the shipped verifier: the resulting accept/deny set is identical to the
      # old unmapped behaviour for every platform role, so this changes nothing for customers —
      # it exists so the staff path can fail closed.
      #
      # Deliberately NO ASTRANULL_OIDC_STAFF_ROLE_MAP. Leaving it unset is what stops a
      # `staff_role` claim from resolving to platform staff authority — including tokens minted
      # before the staff-login mint was closed. Adding an identity staff map here would reopen
      # that hole. Staff roles must come from a real IdP.
      - key: ASTRANULL_OIDC_ROLE_MAP
        scope: RUN_TIME
        value: 'owner:owner,admin:admin,engineer:engineer,soc:soc,auditor:auditor,viewer:viewer'
      # OPERATOR ACTION REQUIRED — the token-signing keypair.
      #
      # This used to be a git-committed file (ops/staging/bundled-oidc-fixture.json) in a
      # PUBLIC repo, which made the deployment's auth trust root world-readable: anyone
      # could mint a valid admin token. That file is now gitignored and excluded from the
      # image, and the published key is refused at startup by fingerprint — untracking it
      # cannot help, since public git history keeps it recoverable forever.
      #
      # The service will NOT START until this secret is set. That is deliberate: booting
      # with no verifiable trust root is worse than being down. To set it:
      #   1. npm run oidc:fixture:generate -- --force
      #   2. Paste the contents of ops/staging/bundled-oidc-fixture.json as this secret.
      #   3. Confirm the startup log reports the new key fingerprint.
      # Rotating invalidates all existing tokens; users simply sign in again.
      - key: ASTRANULL_BUNDLED_STAGING_OIDC_FIXTURE_JSON
        scope: RUN_TIME
        type: SECRET
        # Single quotes are REQUIRED. Substitution is textual, so this becomes
        # `value: {"issuer_suffix":...}` — and unquoted YAML reads a leading `{` as a flow
        # mapping, not a string. App Platform then rejects the whole spec with "cannot
        # unmarshal object into Go struct field AppVariableDefinition.services.envs.value
        # of type string" (run 30693505011). Single quotes also keep the JSON's `"` and the
        # PEM's escaped `\n` literal. A literal apostrophe in the value would need YAML
        # doubling; the generated fixture contains none.
        value: '${ASTRANULL_BUNDLED_STAGING_OIDC_FIXTURE_JSON}'
      - key: ASTRANULL_PUBLIC_LOGIN_URL
        scope: RUN_TIME
        value: /login
      - key: ASTRANULL_PROBE_MODE
        scope: RUN_TIME
        value: signed-worker
      - key: ASTRANULL_HIGH_SCALE_ADAPTER_MODE
        scope: RUN_TIME
        value: disabled
      - key: ASTRANULL_AGENT_IDENTITY_MODE
        scope: RUN_TIME
        value: bearer
      - key: ASTRANULL_WAF_POSTURE_ENABLED
        scope: RUN_TIME
        value: "1"
      - key: ASTRANULL_CONNECTORS_ENABLED
        scope: RUN_TIME
        value: "0"
      - key: ASTRANULL_DATABASE_URL
        scope: RUN_TIME
        value: ${astranull-db.DATABASE_URL}
      # OPERATOR ACTION REQUIRED — this disables PostgreSQL TLS certificate
      # verification (MITM exposure on the DB connection). Left in place only
      # because removing it before a CA is configured would drop the live
      # database connection. To close it out:
      #   1. Download the DigitalOcean managed-Postgres CA certificate.
      #   2. Set ASTRANULL_PG_SSL_CA (PEM contents) or ASTRANULL_PG_SSL_CA_FILE
      #      (mounted path) on this service.
      #   3. Confirm startup logs no longer warn about relaxed TLS, then delete
      #      this variable.
      # With a CA configured the app keeps verification ON and ignores this flag.
      - key: ASTRANULL_PG_SSL_REJECT_UNAUTHORIZED
        scope: RUN_TIME
        value: "0"
      - key: ASTRANULL_SECRET_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${ASTRANULL_SECRET_ENCRYPTION_KEY}
      - key: ASTRANULL_PROBE_WORKER_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${ASTRANULL_PROBE_WORKER_SECRET}