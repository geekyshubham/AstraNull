name: anl-waf-crs-sqli-gap

services:
  origin:
    image: nginx:1.27-alpine
    container_name: anl-waf-crs-sqli-gap-origin
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    volumes:
      - ./origin.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      anl-waf-crs-sqli-gap-net:
        ipv4_address: 172.31.23.11
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ | grep -q 'origin-ok' || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: anl-waf-crs-sqli-gap-waf
    restart: unless-stopped
    user: "0:0"
    cpus: 1.0
    mem_limit: 768m
    environment:
      PORT: 80
      BACKEND: http://172.31.23.11:80
      MODSEC_RULE_ENGINE: "on"
      BLOCKING_PARANOIA: 1
    volumes:
      - ./bypass-low-port.sh:/docker-entrypoint.d/01-check-low-port.sh:ro
      - ./empty-942.conf:/opt/owasp-crs/rules/REQUEST-942-APPLICATION-ATTACK-SQLI.conf:ro
      - ./block-header.conf:/etc/nginx/conf.d/zz-astranull-lab-block-header.conf:ro
    depends_on:
      origin:
        condition: service_healthy
    networks:
      anl-waf-crs-sqli-gap-net:
        ipv4_address: 172.31.23.10
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ | grep -q 'origin-ok' || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 3s

networks:
  anl-waf-crs-sqli-gap-net:
    name: anl-waf-crs-sqli-gap-net
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.31.23.0/24
