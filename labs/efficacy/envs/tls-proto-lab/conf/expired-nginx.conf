events {
    worker_connections 128;
}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/expired.crt;
        ssl_certificate_key /etc/nginx/certs/expired.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            default_type text/plain;
            return 200 "endpoint: expired\nstatus: ok\n";
        }

        location /healthz {
            default_type text/plain;
            return 200 "healthy\n";
        }
    }
}
