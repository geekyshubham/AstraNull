global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout client 1m
    timeout server 1m
    timeout connect 10s
    errorfile 403 /usr/local/etc/haproxy/errors/403.http

frontend default
    mode http
    bind *:80
    log-format "%ci:%cp [%t] %ft %b/%s %ST %B %[var(txn.coraza.id)] spoa-error:%[var(txn.coraza.error)] waf-action:%[var(txn.coraza.action)]"

    http-request set-var(txn.coraza.app) str(sample_app)

    filter spoe engine coraza config /usr/local/etc/haproxy/coraza.cfg
    http-request send-spoe-group coraza coraza-req

    http-request deny deny_status 403 default-errorfiles hdr Server "coraza-waf" hdr X-WAF-Blocked "true" if { var(txn.coraza.action) -m str deny }

    http-request deny deny_status 500 if { var(txn.coraza.error) -m int gt 0 }

    default_backend nginx_backend

backend nginx_backend
    mode http
    server origin 172.31.25.20:80 check

backend coraza-spoa
    mode tcp
    server coraza_spoa 172.31.25.15:9000 check
