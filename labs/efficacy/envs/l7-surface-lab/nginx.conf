# nginx configuration for l7-surface-lab
# Reflects Origin with credentials (planted CORS gap)
# Restricts methods to GET, HEAD, OPTIONS (returns 405 on others)
# Provides /api/health JSON document

server {
    listen 80;
    server_name _;

    # Method restriction: Disallow methods other than GET, HEAD, OPTIONS
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # Dynamic CORS origin reflection
    set $cors_origin "";
    if ($http_origin) {
        set $cors_origin $http_origin;
    }

    location /api/health {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,x-astranull-marker' always;
        add_header 'Allow' 'GET, HEAD, OPTIONS' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,x-astranull-marker' always;
            add_header 'Allow' 'GET, HEAD, OPTIONS' always;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        default_type application/json;
        return 200 '{"status":"ok","service":"l7-surface-lab"}\n';
    }

    location / {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,x-astranull-marker' always;
        add_header 'Allow' 'GET, HEAD, OPTIONS' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,x-astranull-marker' always;
            add_header 'Allow' 'GET, HEAD, OPTIONS' always;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        default_type text/plain;
        return 200 'OK\n';
    }
}
