name: anl-waf-crs-block

services:
  origin:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: anl-waf-crs-block-origin
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    volumes:
      - ./origin.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      anl-waf-crs-block-net:
        ipv4_address: 172.31.21.11

  target:
    image: owasp/modsecurity-crs:nginx-alpine@sha256:f12da37e72e29d1f06e7e829780f1016606d0799eac2966e58ef3819a3d30a50
    container_name: anl-waf-crs-block-target
    restart: unless-stopped
    user: "0:0"
    cpus: 1.0
    mem_limit: 768m
    environment:
      PORT: 80
      BACKEND: http://172.31.21.11:80
      MODSEC_RULE_ENGINE: "on"
      BLOCKING_PARANOIA: 1
    volumes:
      - ./bypass-low-port.sh:/docker-entrypoint.d/01-check-low-port.sh:ro
      - ./block-header.conf:/etc/nginx/conf.d/zz-astranull-lab-block-header.conf:ro
    depends_on:
      - origin
    networks:
      anl-waf-crs-block-net:
        ipv4_address: 172.31.21.10

networks:
  anl-waf-crs-block-net:
    name: anl-waf-crs-block-net
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.31.21.0/24
