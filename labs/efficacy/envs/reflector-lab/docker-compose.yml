name: anl-reflector-lab

services:
  anl-reflector-lab-exposed:
    image: anl-reflector-lab-server:local
    container_name: anl-reflector-lab-exposed
    restart: unless-stopped
    command: ["node", "server.mjs"]
    networks:
      anl-reflector-lab-net:
        ipv4_address: 172.31.42.10
    cpus: 1.0
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "import('http').then(h => h.get('http://127.0.0.1:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)))"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  anl-reflector-lab-protected:
    image: anl-reflector-lab-server:local
    container_name: anl-reflector-lab-protected
    restart: unless-stopped
    command: ["node", "protected-server.mjs"]
    networks:
      anl-reflector-lab-net:
        ipv4_address: 172.31.42.20
    cpus: 1.0
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "import('http').then(h => h.get('http://127.0.0.1:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)))"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

networks:
  anl-reflector-lab-net:
    name: anl-reflector-lab-net
    external: true
