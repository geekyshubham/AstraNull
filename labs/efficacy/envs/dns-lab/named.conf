options {
    directory "/var/bind";
    pid-file "/var/run/named/named.pid";

    listen-on port 53 { any; };
    listen-on-v6 { none; };

    // Strictly authoritative: no recursion, no forwarders, no root hints
    recursion no;
    allow-recursion { none; };
    allow-query-cache { none; };

    // Queries allowed to any client on the internal lab network
    allow-query { any; };

    // Planted condition: AXFR allowed to clients on this lab network (zone-transfer exposure)
    allow-transfer { any; };

    // Keep ANY responses minimal to avoid acting as an amplifier
    minimal-any yes;

    // Synthetic environment settings
    dnssec-validation no;
    empty-zones-enable no;
};

// Synthetic authoritative zone lab.efficacy.invalid only
zone "lab.efficacy.invalid" IN {
    type master;
    file "/etc/bind/lab.efficacy.invalid.zone";
    allow-query { any; };
    allow-transfer { any; };
};
