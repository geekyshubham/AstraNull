worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # Health port: open on both IPv4 and IPv6
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location / {
            default_type text/plain;
            return 200 "healthy\n";
        }
    }

    # Port under test: listener present on both IPv4 and IPv6
    # IPv4 incoming TCP traffic is dropped by iptables
    # IPv6 incoming TCP traffic is unimpeded
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        location / {
            default_type text/plain;
            return 200 "app-ok\n";
        }
    }
}
