limit_req_zone $binary_remote_addr zone=canary_limit:10m rate=18r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"rate_limited","message":"Rate limit exceeded: 3 requests per 10s"}\n';
    }

    location / {
        limit_req zone=canary_limit burst=2 nodelay;
        try_files $uri $uri/ /index.html =404;
    }
}
