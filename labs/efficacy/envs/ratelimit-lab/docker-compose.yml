services:
  limited-origin:
    image: nginx:1.27-alpine
    container_name: anl-ratelimit-lab-limited
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    volumes:
      - ./nginx-limited.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    networks:
      anl-ratelimit-lab-net:
        ipv4_address: 172.31.52.10
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ | grep -q origin-ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  unlimited-origin:
    image: nginx:1.27-alpine
    container_name: anl-ratelimit-lab-unlimited
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    volumes:
      - ./nginx-unlimited.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    networks:
      anl-ratelimit-lab-net:
        ipv4_address: 172.31.52.11
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ | grep -q origin-ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

networks:
  anl-ratelimit-lab-net:
    name: anl-ratelimit-lab-net
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.31.52.0/24
